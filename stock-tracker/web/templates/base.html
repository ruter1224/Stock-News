<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker - 股票成本計算系統</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="dashboard">
                <span class="icon">&#x1F4CA;</span>持有總覽
            </button>
            <button class="tab-btn" data-tab="fund_pool">
                <span class="icon">&#x1F4B0;</span>資金池
            </button>
            <button class="tab-btn" data-tab="stock">
                <span class="icon">&#x1F4CB;</span>個股管理
            </button>
            <button class="tab-btn" data-tab="etf">
                <span class="icon">&#x1F4CB;</span>ETF管理
            </button>
            <button class="tab-btn" data-tab="backtest">
                <span class="icon">&#x1F4C8;</span>回測
            </button>
            <button class="tab-btn" data-tab="news">
                <span class="icon">&#x1F4F0;</span>新聞
            </button>
            <button class="tab-btn" data-tab="archived">
                <span class="icon">&#x1F4E6;</span>已封存
            </button>
            <button class="tab-btn" data-tab="settings">
                <span class="icon">&#x2699;</span>設定
            </button>
        </div>

        <div id="tab-dashboard" class="tab-content active">{% block dashboard %}{% endblock %}</div>
        <div id="tab-fund_pool" class="tab-content">{% block fund_pool %}{% endblock %}</div>
        <div id="tab-stock" class="tab-content">{% block stock_detail %}{% endblock %}</div>
        <div id="tab-etf" class="tab-content">{% block etf_detail %}{% endblock %}</div>
        <div id="tab-backtest" class="tab-content">{% block backtest %}{% endblock %}</div>
        <div id="tab-news" class="tab-content">
            <div class="page-title">&#x1F4F0; 財經頭條</div>
            <div class="action-bar">
                <button class="btn btn-primary" onclick="refreshNews()">&#x1F504; 重新整理</button>
            </div>
            <div id="news-status" style="font-size:13px;color:var(--gray-500);margin-bottom:12px"></div>
            <div id="news-list"></div>
            <div id="news-pagination" class="pagination"></div>
        </div>
        <div id="tab-archived" class="tab-content">
            <div class="page-title">&#x1F4E6; 已封存股票</div>
            <div id="archived-list"></div>
        </div>
        <div id="tab-settings" class="tab-content">{% block settings %}{% endblock %}</div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/chart.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
